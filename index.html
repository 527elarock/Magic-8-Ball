<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Magic 8 Ball</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header></header>

    <main class="container text-center my-auto">
        <h1>Magic 8 Ball App</h1>
        <p id="response-text">Ask a Question...</p>
        <img src="8ball.png" alt="Magic 8 Ball" id="response-img" class="img img-fluid">

        <div class="col text-center mt-4">
            <button onclick="shakeMagic8Ball()" class="btn btn-primary">Ask the Magic 8 Ball</button>
        </div>
    </main>

    <footer>
        <p>&copy;2025 LaRock studios Summary: My magic 8 ball combines JavaScript, CSS, and HTML to provide a responsive prompt with animations and responses to different actions.</p>
    </footer>

    <!-- Modal for question input -->
    <div id="question-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Ask the Magic 8 Ball</h3>
            <input type="text" id="modal-question-input" placeholder="Type your question..." />
            <div class="modal-buttons mt-3">
                <button id="modal-submit" class="btn btn-primary">Ask</button>
                <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Optional Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"
    ></script>

    <script src="8ball.js"></script>
</body>
</html>
